<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Favicon / App Icon DeratPro - Dark Mode (High Resolution 512x512) -->
  <defs>
    <linearGradient id="favDarkGradHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shieldGradHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="darkGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container Fundal Dark cu contur fin cyan neon -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shieldGradHi)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="8" filter="url(#darkGlow)" />

  <g id="spray-bottle-dark">
    <!-- Duza și mecanismul de pulverizare -->
    <path d="M184 128 H304 V160 H184 Z" fill="#94a3b8" />

    <!-- Cap pulverizator și trigger (trăgaci) în nuanță cyan neon -->
    <path d="M240 88 C240 76 256 64 280 64 H320 C328 64 336 72 336 80 V128 H264 L240 88 Z" fill="#38bdf8" />
    <path d="M200 100 L160 92 C152 90 144 96 144 104 C144 112 152 118 160 120 L216 132" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Maneta trăgaciului -->
    <path d="M208 152 C184 176 180 208 192 224" stroke="#94a3b8" stroke-width="18" stroke-linecap="round" />

    <!-- Corpul recipientului (Sticla DDD) -->
    <path d="M216 168 H296 L336 240 C348 260 352 288 352 320 V392 C352 424 328 440 296 440 H216 C184 440 160 424 160 392 V320 C160 288 164 260 176 240 L216 168 Z" fill="url(#favDarkGradHi)" />

    <!-- Fereastră lichid / Reflexie luminoasă -->
    <path d="M188 280 C188 256 200 240 216 212 H296 C312 240 324 256 324 280 V384 C324 404 308 416 288 416 H224 C204 416 188 404 188 384 V280 Z" fill="#0284c7" />

    <!-- Bifa de confirmare / siguranță în cerc protector cu bifă cyan strălucitoare -->
    <circle cx="256" cy="320" r="72" fill="#0b1329" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />
    <path d="M224 320 L248 344 L292 292" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Particule pulverizare fină (Spray Mist) în cyan/sky blue -->
    <circle cx="112" cy="80" r="8" fill="#38bdf8" />
    <circle cx="88" cy="104" r="10" fill="#7dd3fc" />
    <circle cx="100" cy="132" r="6" fill="#38bdf8" />
  </g>
</svg>
